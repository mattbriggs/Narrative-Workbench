[project]
name = "nw-engine"
version = "0.1.0"
description = "Narrative Workbench engine sidecar: typed narrative graph (NetworkX), deterministic validation, and proposal generation."
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.0",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["nw_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
